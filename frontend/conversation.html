<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samtale | Night Agent</title>
  <link rel="icon" href="/public/moon.svg" type="image/svg+xml">
  <link rel="preload" href="/public/fonts/bellefair-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/conversations.html"><svg class="moon" viewBox="0 0 32 32" aria-hidden="true"><defs><mask id="moon-cut-bar"><rect width="32" height="32" fill="#fff"/><circle cx="21.5" cy="10.5" r="9.5" fill="#000"/></mask></defs><circle cx="15" cy="17" r="10" fill="currentColor" mask="url(#moon-cut-bar)"/></svg><span>Night Agent</span></a>
    <nav>
      <a href="/conversations.html" aria-current="page">Samtaler</a>
      <a href="/hotel-info.html">Hotelviden</a>
      <a href="/stats.html">Drift</a>
    </nav>
    <div class="account">
      <span id="user-label" class="muted"></span>
      <button id="logout-btn" type="button">Log ud</button>
    </div>
  </header>
  <main>
    <a class="back" href="/conversations.html">&larr; Alle samtaler</a>
    <p class="eyebrow">Samtale</p>
    <h1 id="conversation-title">Samtale</h1>
    <div id="conversation-meta" class="conversation-top"></div>
    <section id="messages"></section>
    <p id="conversation-error" class="error" hidden></p>
    <div class="actions">
      <button id="take-over" type="button">Overtag</button>
      <button id="hand-back" type="button">Giv tilbage til AI</button>
      <button id="close" type="button">Luk</button>
      <button id="delete" type="button" class="danger">Slet</button>
    </div>
    <form id="reply-form">
      <textarea name="body" maxlength="1000" placeholder="Skriv et svar til gæsten" required></textarea>
      <button type="submit">Send svar</button>
    </form>
  </main>
  <script src="/scripts/common.js"></script>
  <script src="/scripts/conversation.js"></script>
</body>
</html>
