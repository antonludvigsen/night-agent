# Nginx for night-agent.me (Exercise 2, 7, 10)
# Install as /etc/nginx/sites-available/night-agent and symlink to sites-enabled.
# This is the HTTP version from before certbot. `certbot --nginx` then adds
# `listen 443 ssl`, the certificate paths and the redirect from HTTP to HTTPS.

upstream night_agent {
    # Round robin (Exercise 7). With pm2 cluster mode one port is enough;
    # add more servers here if running separate instances on other ports.
    # Port 3100, because the app from Exercise 2 already uses 3000 on the droplet.
    server 127.0.0.1:3100;
}

server {
    listen 80;
    listen [::]:80;
    server_name night-agent.me www.night-agent.me;

    # Everything is passed to Express: webhooks, API and the dashboard pages
    # (the pages are protected by middleware in Express from phase 2).
    location / {
        proxy_pass http://night_agent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
