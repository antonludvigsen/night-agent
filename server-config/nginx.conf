# Nginx for night-agent.me (Exercise 2, 7, 10)
# Install as /etc/nginx/sites-available/night-agent and symlink to sites-enabled.

upstream night_agent {
    # Round robin (Exercise 7). With pm2 cluster mode one port is enough;
    # add more servers here if running separate instances on other ports.
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name night-agent.me www.night-agent.me;
    # Phase 1: certbot --nginx adds the HTTPS server block and redirects HTTP to HTTPS.
    return 301 https://$host$request_uri;
}

