<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log ind | Night Agent</title>
  <link rel="icon" href="/public/moon.svg" type="image/svg+xml">
  <link rel="preload" href="/public/fonts/bellefair-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/public/style.css">
</head>
<body class="login-page">
  <header class="topbar">
    <span class="brand"><svg class="moon" viewBox="0 0 32 32" aria-hidden="true"><defs><mask id="moon-cut-bar"><rect width="32" height="32" fill="#fff"/><circle cx="21.5" cy="10.5" r="9.5" fill="#000"/></mask></defs><circle cx="15" cy="17" r="10" fill="currentColor" mask="url(#moon-cut-bar)"/></svg><span>Night Agent</span></span>
  </header>
  <main class="login">
    <section class="login-hero">
      <svg class="moon" viewBox="0 0 32 32" aria-hidden="true"><defs><mask id="moon-cut-hero"><rect width="32" height="32" fill="#fff"/><circle cx="21.5" cy="10.5" r="9.5" fill="#000"/></mask></defs><circle cx="15" cy="17" r="10" fill="currentColor" mask="url(#moon-cut-hero)"/></svg>
      <p class="eyebrow">AI-natassistent</p>
      <h1>Svar hver gæst,<br>hele natten.</h1>
      <p>Night Agent besvarer gæsternes SMS og WhatsApp ud fra hotellets godkendte viden og giver samtalen videre til personalet, når et menneske skal tage over.</p>
    </section>
    <form id="login-form" method="post" action="/api/auth/login">
      <h2>Log ind</h2>
      <label>Email <input type="email" name="email" autocomplete="username" required></label>
      <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit">Log ind</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </main>
  <script src="/scripts/login.js"></script>
</body>
</html>
