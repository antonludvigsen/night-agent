# Nginx for night-agent.me (Exercise 2, 7, 10, 11)
# Copy of /etc/nginx/sites-available/night-agent on the droplet (symlinked to sites-enabled),
# including the lines certbot added (Exercise 10). Global settings in /etc/nginx/nginx.conf:
# server_tokens off; ssl_protocols TLSv1.2 TLSv1.3; (phase 3 hardening, lecture 11).

# Rate limiting per client IP as the first line of defence (phase 3). Shared by all
# pm2 instances, unlike the counters in express-rate-limit, which live in each process.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=webhooks:10m rate=10r/s;

upstream night_agent {
    # Round robin (Exercise 7). With pm2 cluster mode one port is enough;
    # add more servers here if running separate instances on other ports.
    # Port 3100, because the app from Exercise 2 already uses 3000 on the droplet.
    server 127.0.0.1:3100;
}

server {
    server_name night-agent.me www.night-agent.me;

    # Login: 5 requests per minute per IP, burst 5; above that 429 before Express is reached.
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://night_agent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Twilio webhooks: 10 requests per second per IP, burst 20 (room for Twilio's legitimate traffic).
    location /webhooks/ {
        limit_req zone=webhooks burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://night_agent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything is passed to Express: webhooks, API and the dashboard pages
    # (the pages are protected by middleware in Express from phase 2).
    location / {
        proxy_pass http://night_agent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/night-agent.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/night-agent.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.night-agent.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = night-agent.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name night-agent.me www.night-agent.me;
    return 404; # managed by Certbot
}
